name: solo-dnd
services:
  mongodb:
    image: mongo:8.0 
    container_name: local_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    volumes:
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
      - mongo_data:/data/db
    networks:
      - app_network

  backend:
    build:
      context: ../backend  
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASS}@mongodb:27017/dnd_db
    volumes:
      - ../backend:/app
      - .env:/app/.env
    depends_on:
      - mongodb
    shm_size: '4gb'
    deploy:
      resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
    networks:
      - app_network

  frontend:
    build:
      context: ../frontend 
      dockerfile: Dockerfile
    container_name: vite_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    volumes:
      - ../frontend:/app
      - /app/node_modules # Keeps your container's node_modules separate from your host machine
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
